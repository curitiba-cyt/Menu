    <div class="modal-overlay" id="adModal">

            <div class="timer-text" id="timerText">Processando áudio... Aguarde 15 segundos</div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const adModal = document.getElementById('adModal');
        const timerText = document.getElementById('timerText');
        const downloadBtn = document.getElementById('downloadBtn');

        let audioBlobUrl = null;

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.textContent = file.name;
                convertBtn.style.display = 'block';
            }
        });

        convertBtn.addEventListener('click', async () => {
            const file = videoInput.files[0];
            if (!file) return;

            adModal.style.display = 'flex';
            downloadBtn.style.display = 'none';
            
            const conversionPromise = processAudio(file);

            let timeLeft = 15;
            timerText.textContent = `Processando áudio e gerando link... Aguarde ${timeLeft}s`;

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerText.textContent = `Processando áudio e gerando link... Aguarde ${timeLeft}s`;
                } else {
                    clearInterval(countdown);
                    timerText.textContent = "Processamento concluído!";
                    downloadBtn.style.display = 'block';
                }
            }, 1000);

            audioBlobUrl = await conversionPromise;
            downloadBtn.href = audioBlobUrl;
        });

        async function processAudio(file) {
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length,
                audioBuffer.sampleRate
            );

            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start();

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
            return URL.createObjectURL(wavBlob);
        }

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
                length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                channels = [], i, sample,
                offset = 0,
                pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952);
            setUint32(length - 8);
            setUint32(0x45564157);
            setUint32(0x20746d66);
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/mp3" });
        }
    </script>

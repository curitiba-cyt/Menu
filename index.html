  <script>
    let selectedFile = null;

    function handleFileSelect() {
      const input = document.getElementById('fileInput');
      if (input.files.length > 0) {
        selectedFile = input.files[0];
        document.getElementById('fileLabel').innerText = selectedFile.name;
        document.getElementById('convertBtn').disabled = false;
      }
    }

    async function startConversion() {
      if (!selectedFile) return;

      const btn = document.getElementById('convertBtn');
      const status = document.getElementById('status');
      const adModal = document.getElementById('adModal');
      const timerText = document.getElementById('timerText');
      const downloadLinkBtn = document.getElementById('downloadLinkBtn');

      btn.disabled = true;
      status.innerText = "Iniciando processamento...";

      // Exibe a modal do anúncio com o iframe do Smartlink
      adModal.style.display = 'flex';
      downloadLinkBtn.style.display = 'none';

      let timeLeft = 15;
      timerText.innerText = `Processando áudio... Aguarde ${timeLeft}s`;

      // Regressão do timer de 15 segundos
      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerText.innerText = `Processando áudio... Aguarde ${timeLeft}s`;
        } else {
          clearInterval(countdown);
          timerText.innerText = "Conversão concluída!";
          downloadLinkBtn.style.display = 'block';
        }
      }, 1000);

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const wavBlob = bufferToWavBlob(audioBuffer);

        const url = URL.createObjectURL(wavBlob);
        downloadLinkBtn.href = url;
        downloadLinkBtn.download = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";

        // Ao clicar no botão verde de baixar, fecha a janela modal
        downloadLinkBtn.onclick = () => {
          setTimeout(() => {
            adModal.style.display = 'none';
            status.innerText = "Download iniciado!";
          }, 500);
        };

      } catch (err) {
        console.error(err);
        clearInterval(countdown);
        adModal.style.display = 'none';
        status.innerText = "Erro ao processar o vídeo. Tente outro arquivo MP4.";
        btn.disabled = false;
      }
    }

    function bufferToWavBlob(abuffer) {
      const numOfChan = abuffer.numberOfChannels;
      const length = abuffer.length * numOfChan * 2 + 44;
      const buffer = new ArrayBuffer(length);
      const view = new DataView(buffer);
      const channels = [];
      let sample = 0;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(abuffer.sampleRate);
      setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data" chunk
      setUint32(length - pos - 4);

      for (let i = 0; i < abuffer.numberOfChannels; i++) {
        channels.push(abuffer.getChannelData(i));
      }

      while (offset < abuffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([buffer], { type: "audio/mp3" });
    }
  </script>
